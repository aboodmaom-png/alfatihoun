<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>تحديث المبلغ · الفاتحون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800&display=swap">
<style>
:root{--green:#133F2F;--gold:#C8A04B;--gold-soft:#ead49b;--bg:#F7FAF8;--ink:#10251c;--muted:#5a7068;--hair:rgba(19,63,47,.14);--ok:#1f8a4c;--bad:#b3261e;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(60% 40% at 90% 0%,rgba(124,195,168,.35),transparent 70%),var(--bg);color:var(--ink);font-family:"Noto Kufi Arabic",Tahoma,sans-serif;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.card{width:100%;max-width:400px;background:#fff;border:1px solid var(--hair);border-radius:28px;padding:1.6rem 1.3rem;display:grid;gap:1.1rem;box-shadow:0 18px 44px -22px rgba(19,63,47,.35)}
h1{margin:0;font-size:1.2rem;font-weight:800;color:var(--green);text-align:center}
.now{background:linear-gradient(155deg,#2a7356,var(--green));color:#fff;border-radius:20px;padding:1rem .5rem;display:grid;grid-template-columns:1fr 1fr;row-gap:.8rem;text-align:center}
.now > div{display:grid;gap:.05rem}
.now > div:nth-child(even){border-inline-start:1px solid rgba(255,255,255,.2)}
.now > div{display:grid;gap:.05rem}
.now > div:nth-child(even){border-inline-start:1px solid rgba(255,255,255,.2)}
.now span{font-size:.75rem;opacity:.8}
.now b{font-size:1.3rem;font-weight:800;color:var(--gold-soft);font-variant-numeric:tabular-nums;line-height:1.4}
.now small{font-size:.72rem;opacity:.75}
.rate{font-size:.75rem;color:var(--muted);text-align:center;margin:-.4rem 0 0}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:end}
.pair .eq{padding-bottom:.85rem;color:var(--muted);font-weight:800}
label{display:grid;gap:.35rem;font-size:.85rem;font-weight:600;color:var(--muted);min-width:0}
input{font:inherit;font-size:1.25rem;font-weight:800;color:var(--green);border:1.5px solid var(--hair);border-radius:16px;padding:.65rem .5rem;width:100%;min-width:0;text-align:center;direction:ltr;background:#fff;outline:none}
input:focus{border-color:var(--gold)}
input.pin{font-size:1.1rem;letter-spacing:.3em}
.hint{font-size:.75rem;color:var(--muted);text-align:center;margin:0}
button{font:inherit;font-size:1.05rem;font-weight:800;border:0;border-radius:999px;padding:.85rem;background:var(--green);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:1.6em;text-align:center;font-size:.9rem;font-weight:600;margin:0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.forget{background:none;color:var(--muted);font-size:.78rem;font-weight:600;padding:0;text-decoration:underline}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <h1>تحديث المبلغ المجموع</h1>
  <div class="now">
    <div><span>الصفحة العامة</span><b id="nowPub">…</b><small>من أصل 7,000 شيكل</small></div>
    <div><span>صفحة بو أحمد</span><b id="nowVip">…</b><small>من أصل 10,000 ريال</small></div>
    <div><span>صفحة أم أحمد</span><b id="nowUm">…</b><small>من أصل 7,000 شيكل</small></div>
    <div><span>فريق الماسة</span><b id="nowMs">…</b><small>من أصل 7,000 شيكل</small></div>
  </div>
  <form id="f" novalidate>
    <div style="display:grid;gap:1rem">
      <label for="pub">المبلغ المجموع للصفحة العامة (شيكل)
        <input id="pub" type="number" inputmode="numeric" min="0" placeholder="0">
      </label>
      <label for="vip">المبلغ المجموع لصفحة بو أحمد (ريال)
        <input id="vip" type="number" inputmode="numeric" min="0" placeholder="0">
      </label>
      <label for="um">المبلغ المجموع لصفحة أم أحمد الفرا (شيكل)
        <input id="um" type="number" inputmode="numeric" min="0" placeholder="0">
      </label>
      <label for="ms">المبلغ المجموع لصفحة فريق الماسة (شيكل)
        <input id="ms" type="number" inputmode="numeric" min="0" placeholder="0">
      </label>
      <label for="pin" id="pinWrap">الرمز السري
        <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
      </label>
      <button id="save" type="submit">حفظ</button>
      <p class="msg" id="msg" role="status"></p>
      <button class="forget" type="button" id="forget" hidden>تغيير الرمز السري</button>
    </div>
  </form>
</main>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var fmt = function(n){ return Math.round(Number(n)).toLocaleString('en-US'); };
  var saved = '';
  try { saved = localStorage.getItem('fatihoun-pin') || ''; } catch(e){}
  if (saved){ $('pinWrap').hidden = true; $('forget').hidden = false; }

  function say(t, kind){ var m = $('msg'); m.textContent = t; m.className = 'msg ' + (kind || ''); }
  function show(d){ $('nowPub').textContent = fmt(d.public.raised); $('nowVip').textContent = fmt(d.vip.raised); $('nowUm').textContent = fmt(d.um ? d.um.raised : 0); $('pub').value = d.public.raised; $('vip').value = d.vip.raised; $('um').value = d.um ? d.um.raised : 0; $('nowMs').textContent = fmt(d.almasa ? d.almasa.raised : 0); $('ms').value = d.almasa ? d.almasa.raised : 0; }

  fetch('/api/amount?p=all', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
    if (d.public && d.vip) show(d);
    else { $('nowPub').textContent = $('nowVip').textContent = $('nowUm').textContent = $('nowMs').textContent = '—'; say('التخزين مش مربوط بعد على Vercel', 'bad'); }
  }).catch(function(){ $('nowPub').textContent = $('nowVip').textContent = $('nowUm').textContent = $('nowMs').textContent = '—'; say('تعذّر قراءة المبلغ، تأكد من الإنترنت', 'bad'); });

  $('forget').addEventListener('click', function(){
    try { localStorage.removeItem('fatihoun-pin'); } catch(e){}
    saved = ''; $('pinWrap').hidden = false; $('forget').hidden = true; $('pin').focus();
  });

  $('f').addEventListener('submit', function(e){
    e.preventDefault();
    var a = parseFloat($('pub').value), b = parseFloat($('vip').value), c = parseFloat($('um').value), m = parseFloat($('ms').value), pin = saved || $('pin').value.trim();
    if ([a,b,c,m].some(function(x){ return isNaN(x) || x < 0; })){ say('اكتب المبالغ بالأرقام (0 إذا ما في)', 'bad'); return; }
    if (!pin){ say('اكتب الرمز السري', 'bad'); $('pinWrap').hidden = false; return; }
    $('save').disabled = true; say('جاري الحفظ…');
    fetch('/api/amount', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({pin: pin, public: Math.round(a), vip: Math.round(b), um: Math.round(c), almasa: Math.round(m)})})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, status:r.status, d:d}; }); })
      .then(function(x){
        if (x.ok){
          try { localStorage.setItem('fatihoun-pin', pin); } catch(e){}
          saved = pin; $('pinWrap').hidden = true; $('forget').hidden = false; $('pin').value = '';
          show(x.d); say('تم الحفظ ✓ الصفحات اتحدّثت', 'ok');
        } else if (x.status === 401){
          try { localStorage.removeItem('fatihoun-pin'); } catch(e){}
          saved = ''; $('pinWrap').hidden = false; $('forget').hidden = true;
          say('الرمز السري غلط', 'bad'); $('pin').focus();
        } else { say('ما زبط الحفظ، جرّب كمان مرة', 'bad'); }
      })
      .catch(function(){ say('ما زبط الحفظ، تأكد من الإنترنت', 'bad'); })
      .then(function(){ $('save').disabled = false; });
  });
})();
</script>
</body>
</html>
